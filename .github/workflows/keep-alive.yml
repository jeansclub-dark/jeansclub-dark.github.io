
name: Keep JEANS CLUB Workflows Active

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Keep notification workflow active
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          workflow_files: "dark-humor.yml"
